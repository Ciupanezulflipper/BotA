name: Historical acquisition salvage

on:
  pull_request:
    paths:
      - "audit/historical_acquisition_20260807/**"
      - "tests/test_historical_acquisition_20260807.py"
      - ".github/workflows/historical-acquisition-20260807.yml"
  push:
    branches:
      - "audit/historical-acquisition-salvage-20260807"

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOTA_AUDIT_OANDA_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      SUPABASE_SERVICE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.5
      - name: Compile acquisition module
        run: python -m py_compile audit/historical_acquisition_20260807/acquire.py
      - name: Run focused offline tests
        run: python -m pytest -q tests/test_historical_acquisition_20260807.py
      - name: Prove preview is no-network
        run: |
          python -m audit.historical_acquisition_20260807.acquire preview \
            --output-root /tmp/bota-historical-acquisition > /tmp/preview.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/preview.json").read_text())
          assert payload["mode"] == "dry_run_no_network"
          assert payload["network_permitted"] is False
          assert payload["request_count"] == 8
          assert all("count=" not in row["path_and_query"] for row in payload["requests"])
          print("HISTORICAL_ACQUISITION_PREVIEW=PASS")
          PY
      - name: Prohibit production coupling
        run: |
          if grep -R -nE 'from tools|import tools|subprocess.*tools/|TELEGRAM|SUPABASE' \
            audit/historical_acquisition_20260807/*.py; then
            echo "production coupling found"
            exit 1
          fi
